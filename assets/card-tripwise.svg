<text x="24" y="66" class="m" font-size="12" fill="#F2B45A">AI travel planner</text>
<text x="24" y="98" class="m" font-size="12.5" fill="#C9CFDB">one negotiated itinerary for the whole group</text>
<text x="24" y="120" class="m" font-size="12.5" fill="#8494AD">multi-agent negotiation · expense settlement</text>
<rect x="302" y="26" width="112" height="24" rx="12" fill="#1E2C46" stroke="#2C3E60"/>
<text x="358.0" y="42" class="m" font-size="11.5" fill="#7BD3A0" text-anchor="middle">src · live ✓</text></g>
