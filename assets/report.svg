  .stamp{animation:stamp .35s cubic-bezier(.3,1.6,.6,1) 2s both;transform-origin:770px 92px}
  @keyframes stamp{from{opacity:0;transform:scale(1.6) rotate(-14deg)}to{opacity:.9;transform:scale(1) rotate(-8deg)}}
  @media (prefers-reduced-motion:reduce){.r,.stamp{animation:none}}
</style>
